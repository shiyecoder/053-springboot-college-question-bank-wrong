<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>登录 · 智汇题库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#F5F6F7;color:#1F2933;font-size:13px}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#4B3F72;color:#fff;display:flex;flex-direction:column}
.logo{height:56px;display:flex;align-items:center;gap:9px;padding:0 18px;font-size:15px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo i{width:22px;height:22px;border-radius:6px;background:#E0A458;display:inline-block}
.nav{flex:1;overflow:auto;padding:8px 0}
.nav .g{padding:12px 18px 6px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:13px;color:rgba(255,255,255,.82);border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;border-left-color:#E0A458;font-weight:600}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4)}
.nav a.on .dot{background:#E0A458}
.main{margin-left:220px;min-height:100vh}
.top{height:56px;background:#fff;border-bottom:1px solid #E4E7EB;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:9}
.crumb{font-size:12px;color:#5B6770}.crumb b{color:#1F2933;font-weight:600}
.top .sp{margin-left:auto}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5B6770;cursor:pointer}
.icon-btn:hover{background:#F1F2F4}
.ava{width:30px;height:30px;border-radius:50%;background:#7A6BA8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.who{font-size:12px;line-height:1.3}.who span{color:#5B6770;font-size:11px}
.body{padding:24px}
.card{background:#fff;border:1px solid #E4E7EB;border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #EEF0F2}
.card-h h2{font-size:14px;font-weight:600}.card-h .sub{font-size:12px;color:#5B6770}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi .k{background:#fff;border:1px solid #E4E7EB;border-radius:10px;padding:14px 16px}
.kpi .k .t{font-size:12px;color:#5B6770;display:flex;align-items:center;gap:6px}
.kpi .k .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;color:#4B3F72}
.kpi .k .d{font-size:11px;color:#5B6770;margin-top:2px}
.btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid #D6DAE0;background:#fff;color:#1F2933;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#7A6BA8;color:#4B3F72}
.btn.p{background:#4B3F72;border-color:#4B3F72;color:#fff}.btn.p:hover{background:#3C3260;color:#fff}
.btn.a{background:#E0A458;border-color:#E0A458;color:#3A2A10}
.btn.d{border-color:#B02A37;color:#B02A37;background:#fff}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.inp{height:32px;border:1px solid #D6DAE0;border-radius:7px;padding:0 10px;font-size:13px;color:#1F2933;background:#fff;min-width:180px}
.inp.wide{min-width:360px}
.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filter label{font-size:12px;color:#5B6770}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:#5B6770;background:#FAFBFC;padding:10px 12px;border-bottom:1px solid #E4E7EB;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EEF0F2;font-size:13px;vertical-align:middle}
tbody tr:hover{background:#FBFAFD}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:600;border:1px solid}
.tag.ok{color:#2B7955;background:#EAF4EF;border-color:#C6E0D3}
.tag.warn{color:#8A5A12;background:#FDF3E3;border-color:#F0D9B0}
.tag.err{color:#B02A37;background:#FBEBED;border-color:#EFC9CE}
.tag.info{color:#7A6BA8;background:#F0EEF7;border-color:#D9D3EC}
.tag.gray{color:#5B6770;background:#F2F4F6;border-color:#E1E5E9}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:14px 16px;font-size:12px;color:#5B6770}
.pager b{min-width:28px;height:28px;border:1px solid #D6DAE0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#1F2933;font-weight:400}
.pager b.on{background:#4B3F72;border-color:#4B3F72;color:#fff}
.bar{height:8px;border-radius:4px;background:#EDEFF2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#4B3F72}
.bar i.a{background:#E0A458}.bar i.ok{background:#2B7955}.bar i.d{background:#B02A37}
.muted{color:#5B6770;font-size:12px}
.h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.h3:before{content:"";width:3px;height:13px;border-radius:2px;background:#4B3F72;display:inline-block}
.form-row{display:flex;margin-bottom:14px;align-items:flex-start}
.form-row>label{width:110px;flex:none;text-align:right;padding-right:14px;font-size:13px;color:#5B6770;line-height:32px}
.form-row .ctl{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.three{display:grid;grid-template-columns:1fr 360px;gap:16px}
.chart{height:220px;background:linear-gradient(180deg,#FCFCFD,#F7F8FA);border:1px dashed #DFE3E8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#98A2B3;font-size:12px}
/* 门户壳体（学生端） */
.portal-top{height:60px;background:#4B3F72;color:#fff;display:flex;align-items:center;padding:0 40px;gap:26px}
.portal-top .brand{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}
.portal-top .brand i{width:22px;height:22px;border-radius:6px;background:#E0A458;display:inline-block}
.portal-top nav{display:flex;gap:4px}
.portal-top nav a{padding:7px 14px;border-radius:7px;font-size:13px;color:rgba(255,255,255,.8)}
.portal-top nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.portal-wrap{max-width:1240px;margin:0 auto;padding:24px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid #D6DAE0;border-radius:8px;padding:11px 14px;margin-bottom:10px;background:#fff}
.opt.sel{border-color:#4B3F72;background:#F7F5FC}
.opt .lb{width:22px;height:22px;border-radius:50%;border:1px solid #C9CED6;display:flex;align-items:center;justify-content:center;font-size:11px;color:#5B6770;flex:none}
.opt.sel .lb{background:#4B3F72;border-color:#4B3F72;color:#fff}
.steps{display:flex;gap:0;margin-bottom:18px}
.steps .s{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:#5B6770}
.steps .s .n{width:22px;height:22px;border-radius:50%;border:1px solid #D6DAE0;display:flex;align-items:center;justify-content:center;font-size:11px}
.steps .s.on{color:#4B3F72;font-weight:600}.steps .s.on .n{background:#4B3F72;border-color:#4B3F72;color:#fff}
.steps .s:after{content:"";flex:1;height:1px;background:#E4E7EB;margin:0 10px}
.steps .s:last-child:after{display:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;background:#fff;box-shadow:-8px 0 30px rgba(20,20,40,.12);padding:20px}

body{height:100vh;overflow:hidden;background:#fff}
.split{display:flex;height:100vh}
.left{width:52%;background:#4B3F72;color:#fff;padding:56px 64px;position:relative;overflow:hidden}
.left:before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(122,107,168,.55)}
.left:after{content:"";position:absolute;left:-80px;bottom:-140px;width:340px;height:340px;border-radius:50%;background:rgba(224,164,88,.22)}
.left .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.left .brand i{width:26px;height:26px;border-radius:7px;background:#E0A458;display:inline-block}
.left h1{font-size:40px;line-height:1.35;margin-top:64px;font-weight:700;letter-spacing:-.5px;position:relative;z-index:2}
.left p{margin-top:18px;font-size:14px;line-height:2;color:rgba(255,255,255,.72);position:relative;z-index:2;max-width:420px}
.left .pts{margin-top:44px;display:grid;gap:14px;position:relative;z-index:2}
.left .pts div{display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(255,255,255,.86)}
.left .pts b{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:12px}
.right{flex:1;display:flex;align-items:center;justify-content:center}
.form{width:380px}
.form h2{font-size:24px;font-weight:700}
.form .sub{margin:8px 0 30px;color:#5B6770;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#5B6770;margin-bottom:7px}
.field .box{height:44px;border:1px solid #D6DAE0;border-radius:9px;display:flex;align-items:center;padding:0 13px;gap:9px;font-size:13px;color:#98A2B3}
.field .box.on{border-color:#4B3F72;box-shadow:0 0 0 3px rgba(75,63,114,.1)}
.row{display:flex;justify-content:space-between;font-size:12px;color:#5B6770;margin:4px 0 22px}
.submit{width:100%;height:44px;border-radius:9px;background:#4B3F72;color:#fff;border:0;font-size:14px;font-weight:600;cursor:pointer}
.roles{margin-top:26px;padding-top:18px;border-top:1px solid #EEF0F2;font-size:12px;color:#5B6770}
.roles .r{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.roles .r span{padding:4px 10px;border:1px solid #E4E7EB;border-radius:20px;font-size:11px}
</style></head><body><div class="split">
