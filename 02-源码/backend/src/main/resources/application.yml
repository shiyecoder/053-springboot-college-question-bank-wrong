  datasource:
    url: jdbc:mysql://127.0.0.1:3306/new_053?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
